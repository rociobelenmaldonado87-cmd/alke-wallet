<!DOCTYPE html>

<html lang="es">

    <head>

        <!--Etiquetas meta de mi sitio web-->    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
        
        <!--Link para poner un ícono a la pestaña del navegador-->
        <link rel="shortcut icon" href="../assets/img/Billetera.svg" type="image/x-icon">

        <!--Link al archivo css de BootStrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--Link a mi hoja de estilo personal-->
        <link rel="stylesheet" href="../assets/css/style.css">
        
        <!--Título de la pestaña del navegador-->
        <title>Alke-Wallet - Enviar Dinero</title>
    
    </head>
    
    <body onload="document.getElementById('ocultar').style.display='none'" class="low-opacity-bg-image">

        <header class="container mt-5 text-center bg-light border rounded" style="max-width: 750px;">
            <span class="navbar-text fs-5 text-black fw-bold" id="welcomeMessage">
                Cargando usuario...
            </span>
        </header>

        <section>

            <article class="container mt-5 text-center" style="max-width: 760px;">

                
                <div class="row">
                    <!-- Sección de Envío y Saldo -->
                    <div class="col-md-5 mb-4">
                        <div class="card p-4 shadow">
                            <h2>Enviar Dinero</h2>
                            <h4 class="text-muted mb-4">Saldo Disponible: <span class="text-success" id="balanceDisplay">$0</span></h4>
                            
                            <div class="mb-3">
                                <label class="form-label">Contacto Seleccionado</label>
                                <input type="text" id="selectedContact" class="form-control" readonly placeholder="Seleccione de la lista">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Monto a enviar</label>
                                <input type="number" id="sendAmount" class="form-control" placeholder="Ej: 5000">
                            </div>
                            
                            <button onclick="executeTransfer()" class="btn btn-outline-primary efecto-flotar w-100 mb-2">Transferir</button>
                            <a href="menu.html" class="btn btn-outline-secondary efecto-flotar w-100 mb-2">Volver al Menú</a>
                            <button id="logoutBtn" class="btn btn-outline-danger efecto-flotar w-100">Cerrar Sesión</button>
                        </div>

                        <!-- Formulario agregar contacto -->
                        <div class="card p-4 shadow mt-4 " id="ocultar">
                            <h5>Nuevo Contacto</h5>
                            <input type="text" id="cNombre" class="form-control mb-2" placeholder="Nombre">
                            <input type="text" id="cApellido" class="form-control mb-2" placeholder="Apellido">
                            <input type="text" id="cCuenta" class="form-control mb-2" placeholder="N° Cuenta">
                            <input type="email" id="cCorreo" class="form-control mb-2" placeholder="Correo">
                            <input type="text" id="cBanco" class="form-control mb-2" placeholder="Banco">
                            <button class="btn btn-outline-success efecto-flotar w-auto mt-2"
                                onclick="addContact()">Agregar Contacto</button>
                        </div>
                    </div>

                    <!-- Listado de Contactos -->
                    <div class="col-md-7">
                        <div class="card p-4 shadow">
                            <h3>Contactos</h3>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Cuenta / Banco</th>
                                            <th>Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="contactList"></tbody>
                                    <tfoot>
                                        <button class="btn btn-outline-success efecto-flotar w-auto mt-2"
                                            onclick="document.getElementById('ocultar').style.display='block'">Nuevo Contacto</button>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                
            </article>

        </section>

        <footer class="container mt-5 text-center bg-light border rounded" style="max-width: 750px;">
            <p class="d-inline">&copy;2026 - Alke-Wallet&reg.</p>
            <a href="about.html" class="nav-link">Sobre Nosotros</a>
        </footer>

        <!--JavaScript de BootStrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- Lógica de JavaScript -->
        <script src="../assets/js/sendmoney.js"></script>

    </body>

</html>
