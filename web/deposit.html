<html lang="es">

    <head>

        <meta charset="UTF-8">

        <meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
        
        <!--Link para poner un ícono a la pestaña del navegador-->
        <link rel="shortcut icon" href="../assets/img/Billetera.svg" type="image/x-icon">

        <!--Link al archivo css de BootStrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--Título de la pestaña del navegador-->

    <body class="low-opacity-bg-image">

        <header class="container mt-5 text-center bg-light border rounded" style="max-width: 600px;">
            
            <span class="navbar-text fs-5 text-black fw-bold" id="welcomeMessage">
                Cargando usuario...
            </span>
        
        </header>

        <section>

            <article class="container mt-5 text-center" style="max-width: 600px;">

                <div class="card p-4 shadow">
                    <h2 class="mb-4">Depositar Dinero</h2>

                    <h4 class="text-muted mb-4">Saldo Actual: <span class="text-success" id="balanceDisplay">$0</span></h4>

                    <div class="mb-3">
                        <label class="form-label">Monto a depositar</label>
                        <input type="number" id="amount" class="form-control" placeholder="Ej: 10000">
                    </div>

                    <button onclick="executeDeposit()" class="btn btn-outline-success efecto-flotar w-100 mb-2">Depositar</button>
                    <a href="menu.html" class="btn btn-outline-secondary efecto-flotar w-100 mb-2">Volver al Menú</a>
                    <button id="logoutBtn" class="btn btn-outline-danger efecto-flotar w-100 mb-2">Cerrar Sesión</button>
                </div>

            <article>

        <section>

        <footer class="container mt-5 text-center bg-light border rounded" style="max-width: 600px;">
