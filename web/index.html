<!DOCTYPE html>

<html lang="es">
    
    <head>
        
        <!--Metadatos de mi página Web-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
            
        <!--Link para poner un ícono a la pestaña del navegador-->
        <link rel="shortcut icon" href="../assets/img/Billetera.svg" type="image/x-icon">

        <!--Link al archivo css de BootStrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--Link a mi hoja de estilo personal-->
        <link rel="stylesheet" href="../assets/css/style.css">
        
        <!--Título de la pestaña del navegador-->
        <title>Alke-Wallet | Inicio de Sesión</title>

    </head>
    
    <body onload="document.getElementById('ocultar').style.display='none'" class="low-opacity-bg-image d-flex align-items-center vh-100">
        
        <section>
            <article class="container card shadow p-4 style-card" style="max-width: 400px;">
                    <h2 class="text-center text-primary mb-4">Alke-Wallet</h2>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="correo" class="form-control" required placeholder="ejemplo@correo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="contraseña" class="form-control" required placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-outline-primary efecto-flotar w-100">Iniciar Sesión</button>
                    
                        <button class="btn btn-outline-primary efecto-flotar w-auto mt-2"
                            onclick="document.getElementById('ocultar').style.display='block'">Mostrar Credenciales Ocultas</button>
                        <div id="ocultar" class="row bg-light text-success"><p class="col-12">Ingrese cualquiera de las siguientes credenciales para ingresar a la Wallet:</p>
                            <ul>
                                <li>roberto@correo.cl | JavaFullStack</li>
                                <li>rocio@correo.cl | JavaFullStack</li>
                                <li>christian@correo.cl | JavaFullStack</li>
                            </ul>
                        </div>
                    
                    </form>
            </article>
        </section>

        <!--JavaScript de BootStrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script src="../assets/js/index.js"></script>

    </body>

</html>
